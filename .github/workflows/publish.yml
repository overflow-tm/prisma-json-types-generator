name: Publish to NPM

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: 'NPM tag to publish under'
        required: true
        type: choice
        default: 'latest'
        options:
          - latest
          - beta

permissions:
  id-token: write # Required for OIDC
  contents: read

env:
  NPM_PUBLISH_TAG: ${{ inputs.tag || (github.event.release.prerelease && 'beta' || 'latest') }}

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: NPM Registry
      url: https://www.npmjs.com/package/prisma-json-types-generator

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup node and restore cached dependencies
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'pnpm'

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Uses OIDC authentication
      - name: Publish to NPM @ ${{ env.NPM_PUBLISH_TAG }}
        run: pnpm publish --access public --no-git-checks --tag ${{ env.NPM_PUBLISH_TAG }}
